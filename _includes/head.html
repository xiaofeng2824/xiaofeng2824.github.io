<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- if page.title -%}
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
{%- else -%}
  <title>{{ site.title | escape }}</title>
{%- endif -%}

{%- assign meta_description = page.description | default: site.description -%}
<meta name="description" content="{{ meta_description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<meta name="theme-color" content="#0a0c10">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">

<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
